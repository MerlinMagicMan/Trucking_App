version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trucking_postgres
    environment:
      POSTGRES_USER: trucking_user
      POSTGRES_PASSWORD: trucking_pass
      POSTGRES_DB: trucking_optimization
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trucking_user -d trucking_optimization"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
